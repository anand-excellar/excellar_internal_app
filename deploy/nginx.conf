# Nginx site for Excellar Dashboards on EC2.
#
# This is the ONLY process that listens on a public interface. The portal and
# every dashboard bind to 127.0.0.1, so there is no network path to a dashboard
# that does not pass through the portal's login.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/portal
#   sudo ln -s /etc/nginx/sites-available/portal /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default     # or it will answer on :80
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain a certificate — certbot rewrites this file in place:
#   sudo certbot --nginx -d dash.example.com

server {
    listen 80;
    listen [::]:80;
    server_name dash.example.com;

    # ACME challenges must stay on HTTP; everything else goes to TLS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dash.example.com;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/dash.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dash.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # HSTS: once a browser has seen this, it will not be talked down to HTTP.
    # Only enable after TLS is confirmed working — it is hard to walk back.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # The dashboards render inside this origin only. Deny framing outright so a
    # signed-in user cannot be clickjacked into acting on a dashboard.
    add_header X-Frame-Options SAMEORIGIN always;

    # /api/state on the NAV book can be several hundred KB; the settings POST is
    # small. 5m is generous headroom without inviting an upload as a DoS.
    client_max_body_size 5m;

    access_log /var/log/nginx/portal.access.log;
    error_log  /var/log/nginx/portal.error.log;

    location /static/ {
        alias /opt/excellar/staticfiles/;
        expires 1h;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Django reads this to know the original request was HTTPS; it is what
        # makes request.is_secure() true and Secure cookies work.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # The portal streams non-HTML responses straight from the dashboards;
        # buffering them would add latency and memory for no benefit.
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
}