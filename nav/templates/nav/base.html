<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navdash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <header class="border-b border-gray-800 px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wide text-white">navdash</h1>
        <span class="text-sm text-gray-400" id="last-updated"></span>
    </header>
    <main class="px-6 py-6 space-y-10 max-w-7xl mx-auto">
        {% block content %}{% endblock %}
    </main>
    <script>
        document.getElementById('last-updated').textContent =
            'Updated: ' + new Date().toUTCString();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
